    .chip { background: var(--card); border: 1px solid var(--border); padding: 5px 10px; border-radius: 15px; font-size: 11px; color: #9ca3af; }

<script>
window.addEventListener('DOMContentLoaded', () => {
  const video = document.getElementById('video'), 
        fileInput = document.getElementById('fileInput'),
        videoContainer = document.getElementById('videoContainer'), 
        logoOverlay = document.getElementById('logoOverlay'),
        speedValue = document.getElementById('speedValue'), 
        thumbs = document.getElementById('thumbs'),
        btnPlayPause = document.getElementById('btnPlayPause'),
        canvas = document.getElementById('canvas');

  let captureCounter = 0, currentSpeed = 1.7;

  // Plain silent download — no share sheet, no per-shot prompt, so bulk
  // capture (100-200 shots) doesn't get interrupted. Note: a website cannot
  // silently write into the phone's main Photo Gallery/camera-roll, or create
  // a real folder in Downloads, without a user gesture / native file-system
  // permission each time — that's an OS restriction, not fixable in JS.
  // (A forward-slash in the `download` attribute is NOT reliably treated as
  // a subfolder on Android Chrome — it just gets sanitized into the filename
  // as an underscore, e.g. "nijakural_photo.jpg" sitting loose in Downloads.)
  // For a REAL "nijakural" folder that can be deleted as one unit, see the
  // "Download All" button below — it packs everything into a ZIP with an
  // internal nijakural/ folder, so extracting it creates the real folder.
  function saveOrShareBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }

  fileInput.onchange = () => {
    const file = fileInput.files[0];
    if (file) {
      video.src = URL.createObjectURL(file);
      videoContainer.classList.add('has-video');
      video.playbackRate = currentSpeed;
      video.play();
    }
  };

  video.addEventListener('play', () => { btnPlayPause.textContent = '⏸'; requestWakeLock(); });
  video.addEventListener('pause', () => { btnPlayPause.textContent = '▶'; releaseWakeLock(); });
  video.addEventListener('ended', () => { releaseWakeLock(); });

  // ===== Screen Wake Lock: keep screen ON while capturing/playing =====
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && !video.paused) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (err) {
      // Wake Lock not available/permitted — fail silently, doesn't block app use.
      wakeLock = null;
    }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  // ===== Resume correctly after app is minimized / phone call / tab switch =====
  // Mobile browsers pause <video> and drop the Wake Lock when the app goes to
  // background (e.g. incoming call, home button, app switch). We remember
  // whether the video was actively playing right before that happened, and
  // resume playback + re-acquire the wake lock once the app is visible again.
  let wasPlayingBeforeHidden = false;

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      wasPlayingBeforeHidden = !video.paused && !video.ended && video.currentTime > 0;
    } else {
      if (wasPlayingBeforeHidden && video.paused) {
        video.play().catch(() => {
          // Autoplay-after-return can be blocked on some browsers without a
          // gesture; user just needs one tap on Play in that rare case.
        });
      }
      requestWakeLock();
    }
  });

  btnPlayPause.onclick = () => {
    if (video.paused) { video.play(); } 
    else { video.pause(); }
  };

  const nudgeLogo = (dir) => {
    ensureLeftPosition();
    const step = 10;
    let curTop = logoOverlay.offsetTop;
    let curLeft = logoOverlay.offsetLeft;
    if (dir === 'up') logoOverlay.style.top = (curTop - step) + 'px';
    if (dir === 'down') logoOverlay.style.top = (curTop + step) + 'px';
    if (dir === 'left') logoOverlay.style.left = (curLeft - step) + 'px';
    if (dir === 'right') logoOverlay.style.left = (curLeft + step) + 'px';
  };

  document.getElementById('btnLogoUp').onclick = () => nudgeLogo('up');
  document.getElementById('btnLogoDown').onclick = () => nudgeLogo('down');
  document.getElementById('btnLogoLeft').onclick = () => nudgeLogo('left');
  document.getElementById('btnLogoRight').onclick = () => nudgeLogo('right');
  document.getElementById('btnToggleLogo').onclick = () => {
    logoOverlay.style.display = (logoOverlay.style.display === 'none' ? 'block' : 'none');
  };

  document.getElementById('btnSpeedUp').onclick = () => { currentSpeed += 0.1; video.playbackRate = currentSpeed; speedValue.textContent = currentSpeed.toFixed(1) + 'x'; };
  document.getElementById('btnSpeedDown').onclick = () => { currentSpeed -= 0.1; video.playbackRate = currentSpeed; speedValue.textContent = currentSpeed.toFixed(1) + 'x'; };

  function captureFrame(auto = false) {
    if (!video.videoWidth) return;
    canvas.width = video.videoWidth; 
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if (window.getComputedStyle(logoOverlay).display !== 'none') {
      const vRect = videoContainer.getBoundingClientRect();
      const oRect = logoOverlay.getBoundingClientRect();
      const scale = canvas.width / vRect.width;

      const x = (oRect.left - vRect.left) * scale;
      const y = (oRect.top - vRect.top) * scale;
      const w = oRect.width * scale;
      const h = oRect.height * scale;

      const svgData = new XMLSerializer().serializeToString(logoOverlay.querySelector('svg'));
      const blob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      
      const img = new Image();
      img.onload = () => {
          ctx.drawImage(img, x, y, w, h);
          URL.revokeObjectURL(url);
          finaliseCapture(auto);
      };
      img.src = url;
    } else {
        finaliseCapture(auto);
    }
  }

  document.getElementById('btnCaptureNow').onclick = () => captureFrame(false);

  let capturedShots = [];
  const btnDownloadAll = document.getElementById('btnDownloadAll');

  function updateDownloadAllBtn() {
    const n = capturedShots.length;
    btnDownloadAll.textContent = `⬇ Download All (${n}) as ZIP`;
    btnDownloadAll.style.opacity = n ? '1' : '0.5';
    btnDownloadAll.style.pointerEvents = n ? 'auto' : 'none';
  }

  function finaliseCapture(auto = false) {
    canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const uniqueID = new Date().getTime();
        const name = `NijaKural_${uniqueID}.jpg`;

        if (!auto) {
          // Manual capture: try to save straight to phone Gallery via share sheet
          saveOrShareBlob(blob, name);
        } else {
          // Auto scene-detect capture: no per-shot download prompt.
          // Queue it, download all together later as one ZIP.
          capturedShots.push({ name, blob });
          updateDownloadAllBtn();
        }
        
        const thumbDiv = document.createElement('div');
        thumbDiv.className = 'thumb';
        thumbDiv.innerHTML = `<img src="${url}">`;
        if (auto) {
          thumbDiv.style.cursor = 'pointer';
          thumbDiv.title = 'Tap to download this shot';
          thumbDiv.onclick = () => {
            saveOrShareBlob(blob, name);
          };
        }
        thumbs.prepend(thumbDiv);
        
        ++captureCounter;
        document.getElementById('metaCount').textContent = `📸 Captured: ${captureCounter}`;
    }, 'image/jpeg', 0.95);
  }

  // ---- Minimal ZIP writer (store/no-compression) so all auto-shots become ONE download.
  // Every entry is stored under "nijakural/<file>" INSIDE the zip itself, so no matter
  // what the zip's own downloaded filename ends up being, extracting it (long-press the
  // zip in any Android file manager → Extract) always creates a real "nijakural" folder
  // containing every image — delete that one folder and all the images go with it. ----
  const ZIP_FOLDER = 'nijakural';
  function crc32(data) {
    let c, crc = 0xFFFFFFFF;
    for (let i = 0; i < data.length; i++) {
      c = (crc ^ data[i]) & 0xFF;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crc = (crc >>> 8) ^ c;
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function dosDateTime() {
    const d = new Date();
    const time = ((d.getHours() & 0x1F) << 11) | ((d.getMinutes() & 0x3F) << 5) | (Math.floor(d.getSeconds() / 2) & 0x1F);
    const date = (((d.getFullYear() - 1980) & 0x7F) << 9) | (((d.getMonth() + 1) & 0xF) << 5) | (d.getDate() & 0x1F);
    return { time, date };
  }

  async function buildZip(entries) {
    const { time, date } = dosDateTime();
    const encoder = new TextEncoder();
    const localParts = [], centralParts = [];
    let offset = 0;

    for (const entry of entries) {
      const nameBytes = encoder.encode(`${ZIP_FOLDER}/${entry.name}`);
      const data = new Uint8Array(await entry.blob.arrayBuffer());
      const crc = crc32(data);
      const size = data.length;

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0, true);
      lh.setUint16(8, 0, true);
      lh.setUint16(10, time, true);
      lh.setUint16(12, date, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, size, true);
      lh.setUint32(22, size, true);
      lh.setUint16(26, nameBytes.length, true);
      lh.setUint16(28, 0, true);
      localParts.push(new Uint8Array(lh.buffer), nameBytes, data);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, time, true);
      ch.setUint16(14, date, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, size, true);
      ch.setUint32(24, size, true);
      ch.setUint16(28, nameBytes.length, true);
      ch.setUint32(42, offset, true);
      centralParts.push(new Uint8Array(ch.buffer), nameBytes);

      offset += 30 + nameBytes.length + size;
    }

    const centralStart = offset;
    let centralSize = 0;
    for (const p of centralParts) centralSize += p.length;

    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, entries.length, true);
    eocd.setUint16(10, entries.length, true);
    eocd.setUint32(12, centralSize, true);
    eocd.setUint32(16, centralStart, true);

    return new Blob([...localParts, ...centralParts, new Uint8Array(eocd.buffer)], { type: 'application/zip' });
  }

  btnDownloadAll.onclick = async () => {
    if (!capturedShots.length) return;
    const statusEl = document.getElementById('status');
    statusEl.textContent = '⚡ Zipping into nijakural folder...';
    const zipBlob = await buildZip(capturedShots);
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `NijaKural_Shots_${new Date().getTime()}.zip`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    statusEl.textContent = '⚡ Ready — extract the zip to get the nijakural folder';
  };

  let dragging = false, ox, oy;
  function ensureLeftPosition() {
    const cs = window.getComputedStyle(logoOverlay);
    if (cs.right !== 'auto') {
        const cl = logoOverlay.offsetLeft; 
        logoOverlay.style.right = 'auto';
        logoOverlay.style.left = cl + 'px';
    }
  }

  const startDrag = (e) => {
    dragging = true; ensureLeftPosition();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    ox = cx - logoOverlay.offsetLeft; oy = cy - logoOverlay.offsetTop;
    if (e.cancelable) e.preventDefault();
  };

  const moveDrag = (e) => {
    if (!dragging) return;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    logoOverlay.style.left = (cx - ox) + 'px'; logoOverlay.style.top = (cy - oy) + 'px'; 
  };

  logoOverlay.addEventListener('mousedown', startDrag);
  document.addEventListener('mousemove', moveDrag);
  document.addEventListener('mouseup', () => dragging = false);
  logoOverlay.addEventListener('touchstart', startDrag, {passive:false});
  document.addEventListener('touchmove', moveDrag, {passive:false});
  document.addEventListener('touchend', () => dragging = false);

  video.onloadedmetadata = () => document.getElementById('metaRes').textContent = `📐 ${video.videoWidth}x${video.videoHeight}`;

  // ===== Auto Scene-Change Capture =====
  const diffCanvas = document.getElementById('diffCanvas');
  const dctx = diffCanvas.getContext('2d', { willReadFrequently: true });
  const btnAutoCapture = document.getElementById('btnAutoCapture');
  const autoSensitivity = document.getElementById('autoSensitivity');
  const autoSensitivityValue = document.getElementById('autoSensitivityValue');

  let autoCaptureOn = false;
  let prevFrameData = null;
  let lastSampleTime = 0;
  let lastAutoCaptureTime = 0;
  const SAMPLE_INTERVAL_MS = 150;   // frame sampling rate for diff checking
  const COOLDOWN_MS = 700;          // min gap between two auto captures

  autoSensitivity.oninput = () => { autoSensitivityValue.textContent = autoSensitivity.value; };

  btnAutoCapture.onclick = () => {
    autoCaptureOn = !autoCaptureOn;
    btnAutoCapture.textContent = autoCaptureOn ? '🔍 Auto Scene: ON' : '🔍 Auto Scene: OFF';
    btnAutoCapture.style.background = autoCaptureOn ? 'linear-gradient(135deg, #10b981, #059669)' : '#374151';
    prevFrameData = null;
    if (autoCaptureOn) requestAnimationFrame(autoDetectLoop);
  };

  function autoDetectLoop(ts) {
    if (!autoCaptureOn) return;

    if (!video.paused && !video.ended && video.videoWidth && ts - lastSampleTime >= SAMPLE_INTERVAL_MS) {
      lastSampleTime = ts;
      dctx.drawImage(video, 0, 0, diffCanvas.width, diffCanvas.height);
      const frame = dctx.getImageData(0, 0, diffCanvas.width, diffCanvas.height).data;

      if (prevFrameData) {
        let diffSum = 0;
        // sample every 4th pixel (RGBA step of 16) for speed
        for (let i = 0; i < frame.length; i += 16) {
          diffSum += Math.abs(frame[i] - prevFrameData[i])
                   + Math.abs(frame[i + 1] - prevFrameData[i + 1])
                   + Math.abs(frame[i + 2] - prevFrameData[i + 2]);
        }
        const pixelsCompared = frame.length / 16;
        const avgDiff = diffSum / (pixelsCompared * 3); // 0-255 scale

        const threshold = parseInt(autoSensitivity.value, 10); // lower = more sensitive
        if (avgDiff > threshold && (ts - lastAutoCaptureTime) > COOLDOWN_MS) {
          lastAutoCaptureTime = ts;
          document.getElementById('status').textContent = '⚡ Scene Detected!';
          captureFrame(true);
        }
      }
      prevFrameData = frame;
    }
    requestAnimationFrame(autoDetectLoop);
  }
});
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('SW registration failed:', err);
      });
    });
  }
</script>
